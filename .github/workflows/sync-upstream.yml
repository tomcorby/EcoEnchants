name: Sync from upstream

on:
  schedule:
    - cron: '0 3 * * *'  # every day at 3 AM UTC
  workflow_dispatch:      # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # we'll use a token

      - name: Set up Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions Bot"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/Auxilor/EcoEnchants.git
          git fetch upstream

      - name: Merge upstream/master into your master
        run: |
          git checkout master
          git merge upstream/master --allow-unrelated-histories --no-edit || true

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
